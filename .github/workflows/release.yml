name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            artifact_name: dpm-simulator-linux
          - os: windows-latest
            artifact_name: dpm-simulator-windows
          - os: macos-latest
            artifact_name: dpm-simulator-macos

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcgal-dev libboost-all-dev libgmp-dev libmpfr-dev

      - name: Install Dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install cgal boost gmp mpfr

      - name: Install Dependencies (Windows)
        if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-cgal
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-gmp
            mingw-w64-x86_64-mpfr

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked

      - name: Build and Package
        shell: bash
        run: |
          # Ensure workspace build profiles are used
          cargo packager --release --verbose

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: simulator/dist/*
