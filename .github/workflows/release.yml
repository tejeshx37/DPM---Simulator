name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build (ubuntu-latest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcgal-dev libboost-all-dev libgmp-dev libmpfr-dev

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked

      - name: Build and Package
        shell: bash
        run: |
          # Build the simulator binary
          cargo build --release -p simulator
          
          # Rename the binary
          cp target/release/simulator target/release/simulator-linux
          
          # Run packager from the simulator directory
          cd simulator
          cargo packager --release --verbose --formats deb

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dpm-simulator-linux
          path: |
            simulator/dist/*
            target/release/simulator-linux

